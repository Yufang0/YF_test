<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焦點樣式測試 - 最終版本</title>
    <style>
        /* 複製項目的焦點樣式 */
        *:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible,
        a:focus-visible,
        [tabindex]:focus-visible,
        .btn:focus-visible,
        .btn-primary:focus-visible,
        .btn-secondary:focus-visible,
        .btn-danger:focus-visible,
        .btn-outline-primary:focus-visible,
        .btn-outline-secondary:focus-visible,
        .btn-outline-danger:focus-visible,
        .form-control:focus-visible,
        .btn-close:focus-visible,
        [role="button"]:focus-visible,
        .nav-link:focus-visible,
        .sidebar .nav-link:focus-visible,
        .sidebar-nav .nav-link:focus-visible {
            outline: 3px solid #007bff !important;
            outline-offset: 2px !important;
            box-shadow: none !important;
            border-radius: 4px !important;
            z-index: 9999 !important;
        }

        button:focus,
        input:focus,
        textarea:focus,
        select:focus,
        a:focus,
        [tabindex]:focus,
        .btn:focus,
        .form-control:focus,
        .btn-close:focus,
        .nav-link:focus,
        .sidebar .nav-link:focus,
        .sidebar-nav .nav-link:focus {
            outline: none !important;
            box-shadow: none !important;
        }

        /* 模擬項目的基本樣式 */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f5f5f5;
        }

        .test-section {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .btn {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            margin: 5px;
            border-radius: 4px;
        }

        .btn-primary {
            background: #007bff;
            color: white;
            border-color: #007bff;
        }

        .nav-link {
            display: inline-block;
            padding: 10px 15px;
            text-decoration: none;
            color: #333;
            background: #f8f9fa;
            margin: 5px;
            border-radius: 4px;
        }

        .sidebar-nav .nav-link {
            background: #e9ecef;
            border-left: 3px solid transparent;
        }

        input, textarea, select {
            padding: 8px;
            border: 1px solid #ccc;
            margin: 5px;
            border-radius: 4px;
        }

        .test-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>焦點樣式測試 - 最終版本</h1>
    <p>使用 Tab 鍵導航測試所有元素的焦點樣式。預期所有元素都應該顯示藍色邊框（#007bff）。</p>

    <div class="test-section">
        <h2>1. 新增員工按鈕測試</h2>
        <button type="button" class="btn btn-primary">+ 新增員工</button>
        <button type="button" class="btn">一般按鈕</button>
    </div>

    <div class="test-section">
        <h2>2. 側邊欄導航連結測試</h2>
        <div class="sidebar-nav">
            <a href="#" class="nav-link">📊 儀表板</a>
            <a href="#" class="nav-link">👥 員工管理</a>
            <a href="#" class="nav-link">🏢 部門管理</a>
            <a href="#" class="nav-link">📚 課程管理</a>
        </div>
    </div>

    <div class="test-section">
        <h2>3. 一般導航連結測試</h2>
        <a href="#" class="nav-link">一般導航連結</a>
        <a href="#" tabindex="0">帶 tabindex 的連結</a>
    </div>

    <div class="test-section">
        <h2>4. 表單元素測試</h2>
        <div class="test-grid">
            <input type="text" placeholder="文字輸入框" class="form-control">
            <select class="form-control">
                <option>選擇選項</option>
                <option>選項 1</option>
                <option>選項 2</option>
            </select>
            <textarea placeholder="文字區域" class="form-control"></textarea>
            <button type="submit" class="btn btn-primary">送出</button>
        </div>
    </div>

    <div class="test-section">
        <h2>5. 各種按鈕變體測試</h2>
        <div class="test-grid">
            <button class="btn btn-primary">主要按鈕</button>
            <button class="btn btn-secondary">次要按鈕</button>
            <button class="btn btn-danger">危險按鈕</button>
            <button class="btn btn-outline-primary">外框主要</button>
            <button class="btn btn-outline-secondary">外框次要</button>
            <button class="btn btn-outline-danger">外框危險</button>
        </div>
    </div>

    <div class="test-section">
        <h2>6. 使用者互動元素測試</h2>
        <div tabindex="0" style="padding: 10px; background: #f8f9fa; margin: 5px; cursor: pointer;">
            帶 tabindex 的 div（模擬使用者資訊）
        </div>
        <button type="button" class="btn">🚪 登出</button>
    </div>

    <script>
        // 即時焦點事件監控
        document.addEventListener('focusin', function(e) {
            console.log('Focus in:', e.target.tagName, e.target.className || '(no class)');
        });

        document.addEventListener('focusout', function(e) {
            console.log('Focus out:', e.target.tagName, e.target.className || '(no class)');
        });

        // 鍵盤事件監控
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                console.log('Tab navigation detected');
            }
        });
    </script>
</body>
</html>
