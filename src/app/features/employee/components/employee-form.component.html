<div class="employee-form">
  <form [formGroup]="employeeForm" (ngSubmit)="onSubmit()" class="form">
    <!-- 表單標題 -->
    <header class="form-header">
      <h2 class="form-title">{{ getFormTitle() }}</h2>
    </header>

    <!-- 錯誤訊息 -->
    @if (formErrors().length > 0) {
      <div class="alert alert-error" role="alert">
        <strong>錯誤：</strong>
        <ul class="error-list">
          @for (error of formErrors(); track error) {
            <li>{{ error }}</li>
          }
        </ul>
      </div>
    }

    <!-- 表單欄位 -->
    <div class="form-body">
      <!-- 員工姓名 -->
      <div class="form-group">
        <label for="employeeName" class="form-label required">
          員工姓名
        </label>
        <input
          id="employeeName"
          type="text"
          class="form-input"
          formControlName="name"
          placeholder="請輸入員工姓名"
          [class.error]="hasFieldError('name')"
          maxlength="50"
          required>
        @if (hasFieldError('name')) {
          <div class="field-error" role="alert">
            {{ getFieldError('name') }}
          </div>
        }
      </div>

      <!-- 部門選擇 -->
      <div class="form-group">
        <label for="employeeDepartment" class="form-label required">
          部門
        </label>
        <select
          id="employeeDepartment"
          class="form-select"
          formControlName="departmentId"
          [class.error]="hasFieldError('departmentId')"
          required>
          <option value="">請選擇部門</option>
          @for (dept of departments(); track dept.id) {
            <option [value]="dept.id">{{ dept.name }}</option>
          }
        </select>
        @if (hasFieldError('departmentId')) {
          <div class="field-error" role="alert">
            {{ getFieldError('departmentId') }}
          </div>
        }
      </div>
    </div>

    <!-- 表單操作按鈕 -->
    <footer class="form-footer">
      <div class="form-actions">
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onCancel()"
          [disabled]="isSubmitting()">
          取消
        </button>
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="employeeForm.invalid || isSubmitting()">
          @if (isSubmitting()) {
            <span class="loading-spinner small"></span>
          }
          {{ getSubmitButtonText() }}
        </button>
      </div>
    </footer>
  </form>
</div>
